name: Sentience AI CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm --prefix functions ci

      - name: Frontend Typecheck (tsc)
        run: npm run lint

      - name: Cloud Functions Typecheck (tsc)
        run: npm --prefix functions run lint

  test:
    name: Vitest Test Suite
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Tests (Vitest)
        run: npm test -- --run --pool=vmThreads

  build:
    name: Build Frontend & Functions
    runs-on: ubuntu-latest
    needs: [validate, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Functions Dependencies
        run: npm --prefix functions ci

      - name: Build Frontend (Vite)
        run: npm run build

      - name: Build Functions (tsc)
        run: npm --prefix functions run build

      - name: Archive Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: sentience-ai-dist
          path: dist
          retention-days: 7

  deploy-preview:
    name: Deploy PR Preview to Firebase
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && env.FIREBASE_SA != ''
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SENTIENCE_AI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: sentience-ai-dist
          path: dist

      - name: Deploy to Firebase Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SENTIENCE_AI }}
          expires: 7d
          projectId: sentience-ai-free-2026

  deploy-live:
    name: Deploy Live to Firebase Hosting
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.FIREBASE_SA != ''
    env:
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SENTIENCE_AI }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: sentience-ai-dist
          path: dist

      - name: Deploy to Firebase Live Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SENTIENCE_AI }}
          channelId: live
          projectId: sentience-ai-free-2026
