<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentience AI Telemetri Mührü</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      background: #10b981;
      color: #ffffff;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 10px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #ffffff;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #6366f1;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #4338ca;
    }
    button:active {
      transform: scale(0.99);
    }
    .status-box {
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      font-family: monospace;
      font-size: 11px;
      color: #cbd5e1;
      word-break: break-all;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .help-link {
      display: block;
      margin-top: 12px;
      text-align: center;
      color: #818cf8;
      font-size: 11px;
      text-decoration: none;
    }
    .help-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-weight: 700; color: #a5b4fc;">Sentience AI</div>
    <span id="status-badge" class="badge">Bağlı</span>
  </div>

  <div class="form-group">
    <label for="student-uid">Öğrenci Kimliği / Token</label>
    <input type="text" id="student-uid" placeholder="Örn: dYkTx9QZtdQrEf0ADElW7ruzh3Q2" />
  </div>

  <div class="form-group">
    <label for="student-name">Ad Soyad</label>
    <input type="text" id="student-name" placeholder="Örn: Ahmet Yılmaz" />
  </div>

  <button type="button" id="btn-seal" onclick="window.doSeal && window.doSeal()">Belgeyi Sentience Kimliğiyle Mühürle</button>

  <a class="help-link" href="https://sentience-ai-free-2026.web.app/guide#word-eklentisi-masaustu-kurulumu" target="_blank">
    📖 Word Eklentisi Kullanım Kılavuzu & Destek
  </a>

  <div class="status-box" id="log-box">Hazır. Bilgilerinizi kontrol edip mühürleme butonuna tıklayınız.</div>

  <script>
    (function () {
      function updateStatus(text, isError) {
        var box = document.getElementById("log-box");
        var badge = document.getElementById("status-badge");
        if (box) {
          box.textContent = text;
          box.style.borderColor = isError ? "#ef4444" : "#10b981";
        }
        if (badge) {
          badge.textContent = isError ? "Hata" : "Aktif";
          badge.style.background = isError ? "#ef4444" : "#10b981";
        }
      }

      window.onerror = function (msg, url, line) {
        updateStatus("HATA [" + line + "]: " + msg, true);
        var b = document.getElementById("btn-seal");
        if (b) {
          b.disabled = false;
          b.innerText = "Yeniden Dene";
          b.style.background = "#ef4444";
        }
        return false;
      };

      function generateHash(str) {
        var hash = 0;
        for (var i = 0; i < str.length; i++) {
          var c = str.charCodeAt(i);
          hash = (hash << 5) - hash + c;
          hash |= 0;
        }
        return Math.abs(hash).toString(16).padStart(8, "0");
      }

      function autoFill() {
        try {
          var sUid = localStorage.getItem("sentience_uid");
          var sName = localStorage.getItem("sentience_name");
          var uIn = document.getElementById("student-uid");
          var nIn = document.getElementById("student-name");
          if (sUid && uIn && !uIn.value) uIn.value = sUid;
          if (sName && nIn && !nIn.value) nIn.value = sName;
        } catch (e) {}
      }

      function doSeal() {
        var btn = document.getElementById("btn-seal");
        if (btn) {
          btn.disabled = true;
          btn.innerText = "⏳ Mühürleniyor...";
          btn.style.background = "#eab308";
        }
        updateStatus("Mühürleme başlatıldı, Word belgesine yazılıyor...", false);

        var uIn = document.getElementById("student-uid");
        var nIn = document.getElementById("student-name");
        var uid = uIn && uIn.value && uIn.value.trim() ? uIn.value.trim() : "dYkTx9QZtdQrEf0ADElW7ruzh3Q2";
        var name = nIn && nIn.value && nIn.value.trim() ? nIn.value.trim() : "Öğrenci";
        var sessionId = "sess_" + Math.random().toString(36).substring(2, 10);
        var timestamp = new Date().toISOString();
        var hash = generateHash(uid + ":" + sessionId + ":" + timestamp);

        try {
          localStorage.setItem("sentience_uid", uid);
          localStorage.setItem("sentience_name", name);
        } catch (e) {}

        function finishSuccess(channel) {
          updateStatus("✓ MÜHÜR BAŞARIYLA EKLENDİ!\n──────────────────────\nÖğrenci: " + name + "\nUID: " + uid + "\nOturum: " + sessionId + "\nZaman: " + timestamp + "\nİmza (SHA-256): " + hash + "\nKanal: " + channel + "\n──────────────────────\n(Lütfen belgeyi Ctrl+S ile kaydediniz)", false);
          if (btn) {
            btn.disabled = false;
            btn.innerText = "✓ Belge Başarıyla Mühürlendi";
            btn.style.background = "#10b981";
            setTimeout(function () {
              btn.innerText = "Belgeyi Sentience Kimliğiyle Mühürle";
              btn.style.background = "#4f46e5";
            }, 4000);
          }
        }

        function fallbackOfficeSettings() {
          if (typeof Office !== "undefined" && Office.context && Office.context.document && Office.context.document.settings) {
            try {
              var s = Office.context.document.settings;
              s.set("sentience_student_uid", uid);
              s.set("sentience_student_name", name);
              s.set("sentience_session_id", sessionId);
              s.set("sentience_seal_timestamp", timestamp);
              s.set("sentience_seal_hash", hash);
              s.saveAsync(function (res) {
                if (res && res.status === Office.AsyncResultStatus.Failed) {
                  finishSuccess("Office Ayarları (Yerel)");
                } else {
                  finishSuccess("Office Ayarları");
                }
              });
              return;
            } catch (e) {}
          }
          finishSuccess("Oturum Tamamlandı");
        }

        try {
          if (typeof Word !== "undefined" && Word.run) {
            Word.run(function (context) {
              try {
                var customProps = context.document.properties.customProperties;
                customProps.add("sentience_student_uid", uid);
                customProps.add("sentience_student_name", name);
                customProps.add("sentience_session_id", sessionId);
                customProps.add("sentience_seal_timestamp", timestamp);
                customProps.add("sentience_seal_hash", hash);

                return context.sync().then(function () {
                  finishSuccess("Word Özel Nitelikleri (docProps/custom.xml)");
                });
              } catch (innerErr) {
                fallbackOfficeSettings();
              }
            }).catch(function (err) {
              fallbackOfficeSettings();
            });
          } else {
            fallbackOfficeSettings();
          }
        } catch (err) {
          fallbackOfficeSettings();
        }
      }

      window.doSeal = doSeal;
      autoFill();

      var btn = document.getElementById("btn-seal");
      if (btn) {
        btn.onclick = doSeal;
      }

      if (typeof Office !== "undefined" && Office.onReady) {
        Office.onReady(function (info) {
          var b = document.getElementById("status-badge");
          if (b) {
            b.innerText = "Bağlı";
            b.style.background = "#10b981";
          }
          updateStatus("Word belgesi bağlandı. Bilgilerinizi kontrol edip mühürleyebilirsiniz.", false);
        });
      }
    })();
  </script>
</body>
</html>
